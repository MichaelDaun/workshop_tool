<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logikgrindar – Verkstan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .board { user-select: none; touch-action: manipulation; }
  .w { fill: none; stroke: var(--line); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--calm); }
  .w.on { stroke: var(--active); stroke-dasharray: 12 9; animation: flow .7s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -21; } }
  .gate { fill: var(--sheet); stroke: var(--graphite); stroke-width: 3.5; stroke-linejoin: round; }
  .gate-name { font-family: var(--font-text); font-weight: 800; font-size: 22px; fill: var(--graphite); }
  .sw { cursor: pointer; outline: none; }
  .sw:focus-visible .sw-case { stroke-width: 4; }
  .sw-case { fill: var(--sheet); stroke: var(--graphite); stroke-width: 2.5; }
  .sw-arm { fill: var(--graphite); transition: transform var(--calm) var(--ease); transform-box: fill-box; transform-origin: center; transform: rotate(-12deg); }
  .sw.on .sw-arm { fill: var(--active); transform: rotate(12deg); }
  .sw.disabled { opacity: .3; cursor: default; }
  .sw-label { font-family: var(--font-text); font-weight: 800; font-size: 28px; fill: var(--graphite); }
  .bit { font-family: var(--font-num); font-size: 18px; fill: var(--pencil); }
  .lamp { fill: var(--sheet); stroke: var(--graphite); stroke-width: 3; transition: fill var(--calm); }
  .lamp.on { fill: var(--active); }
  .lamp-glow { fill: var(--active); opacity: 0; transition: opacity var(--calm); }
  .lamp-glow.on { opacity: .22; }
  .lamp-glow.blink { animation: blink .6s var(--ease); }
  @keyframes blink { 40% { opacity: .6; } }

  .gates { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 560px) { .gates { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .gate-btn { display: grid; justify-items: center; gap: 2px; padding: 10px 6px; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); }
  .gate-btn:hover { border-color: var(--graphite); }
  .gate-btn svg { width: 56px; height: 36px; }
  .gate-btn path, .gate-btn circle { fill: none; stroke: var(--graphite); stroke-width: 2.5; }
  .gate-btn b { font-size: 16px; }
  .gate-btn[aria-pressed="true"] { border: 2px solid var(--graphite); background: color-mix(in srgb, var(--active) 10%, var(--sheet)); }

  .truth { width: 100%; border-collapse: collapse; }
  .truth th { font-size: var(--fs-small); color: var(--pencil); font-weight: 400; padding: 4px; }
  .truth td { text-align: center; padding: 7px 4px; border-top: 1px solid var(--grid); }
  .truth tr.now td { background: color-mix(in srgb, var(--active) 10%, var(--sheet)); }
  .led { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--graphite); vertical-align: -2px; margin-right: 6px; }
  .led.on { background: var(--active); border-color: var(--active); }
  .unknown { font-family: var(--font-num); color: var(--pencil); }
</style>
</head>
<body data-domain="logic">
<header class="topbar" data-title-sv="Logikgrindar" data-title-en="Logic gates"></header>

<main class="module">
  <section class="stage">
    <div class="scene">
      <svg class="board" viewBox="0 0 800 400" role="img" aria-label="Två brytare kopplade via en logikgrind till en lampa" data-aria-en="Two switches connected through a logic gate to a lamp">
        <path id="wa" class="w" d=""/>
        <path id="wb" class="w" d=""/>
        <path id="wo" class="w" d="M462,200 H650"/>
        <g id="swA" class="sw" tabindex="0" role="switch" aria-checked="false" aria-label="Brytare A" data-aria-en="Switch A">
          <text class="sw-label" x="40" y="125">A</text>
          <rect class="sw-case" x="80" y="88" width="110" height="54" rx="8"/>
          <rect class="sw-arm" x="100" y="102" width="70" height="26" rx="5"/>
          <text class="bit" id="bitA" x="135" y="170" text-anchor="middle">0</text>
        </g>
        <g id="swB" class="sw" tabindex="0" role="switch" aria-checked="false" aria-label="Brytare B" data-aria-en="Switch B">
          <text class="sw-label" x="40" y="305">B</text>
          <rect class="sw-case" x="80" y="268" width="110" height="54" rx="8"/>
          <rect class="sw-arm" x="100" y="282" width="70" height="26" rx="5"/>
          <text class="bit" id="bitB" x="135" y="350" text-anchor="middle">0</text>
        </g>
        <path id="gate" class="gate" d=""/>
        <path id="gate-extra" class="gate" d="" style="fill:none"/>
        <circle id="gate-bubble" class="gate" cx="452" cy="200" r="8" style="display:none"/>
        <text id="gate-name" class="gate-name" x="395" y="305" text-anchor="middle"></text>
        <circle id="glow" class="lamp-glow" cx="690" cy="200" r="78"/>
        <circle id="lamp" class="lamp" cx="690" cy="200" r="38"/>
        <path d="M676 200 l7 -10 l7 10 l7 -10" fill="none" stroke="var(--graphite)" stroke-width="2.5"/>
        <text class="bit" id="bitO" x="690" y="272" text-anchor="middle">0</text>
      </svg>
    </div>
    <div class="gates" id="gates"></div>

    <div>
      <table class="truth" id="truth">
        <thead><tr><th>A</th><th>B</th><th data-en="Lamp">Lampa</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <aside class="panel">
    <div class="mission" id="mission">
      <p class="meta" data-en="Digital logic · 2–4 people · 20 min">Digital logik · 2–4 personer · 20 min</p>
      <h2 data-en="Three lamps, three rules">Tre lampor, tre regler</h2>
    </div>

    <details class="why">
      <summary data-en="What happened?">Vad hände?</summary>
      <div class="body">
        <p data-en="A gate answers 1 or 0 depending on what comes in. A phone holds billions of them.">En grind svarar 1 eller 0 beroende på vad som kommer in. En mobil innehåller miljarder.</p>
      </div>
    </details>

    <div id="box"></div>
  </aside>
</main>

<script src="../shared/kit.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const OR_SHAPE = "M332,140 Q368,200 332,260 Q420,260 462,200 Q420,140 332,140 Z";
  const GATES = {
    and: { sv: "OCH", en: "AND", fn: (a, b) => a && b, two: true, d: "M340,140 H400 A60,60 0 0 1 400,260 H340 Z" },
    or:  { sv: "ELLER", en: "OR", fn: (a, b) => a || b, two: true, d: OR_SHAPE },
    xor: { sv: "ANTINGEN", en: "XOR", fn: (a, b) => a !== b, two: true, d: "M340,140 Q376,200 340,260 Q428,260 462,200 Q428,140 340,140 Z", extra: "M322,140 Q358,200 322,260" },
    nor: { sv: "INGEN", en: "NOR", fn: (a, b) => !(a || b), two: true, d: "M332,140 Q368,200 332,260 Q412,260 446,200 Q412,140 332,140 Z", bubble: true },
    not: { sv: "INTE", en: "NOT", fn: a => !a, two: false, d: "M345,150 L436,200 L345,250 Z", bubble: true }
  };
  const ICONS = {
    and: '<path d="M10,5 H30 A15,15 0 0 1 30,35 H10 Z"/>',
    or:  '<path d="M8,5 Q18,20 8,35 Q36,35 52,20 Q36,5 8,5 Z"/>',
    xor: '<path d="M12,5 Q22,20 12,35 Q40,35 54,20 Q40,5 12,5 Z"/><path d="M5,5 Q15,20 5,35"/>',
    nor: '<path d="M6,5 Q16,20 6,35 Q32,35 46,20 Q32,5 6,5 Z"/><circle cx="51" cy="20" r="4"/>',
    not: '<path d="M14,5 L44,20 L14,35 Z"/><circle cx="49" cy="20" r="4"/>'
  };

  const state = { a: false, b: false, gate: "and", seen: new Set(), seenOnBox: new Set() };
  const tasks = K.tasks($("mission"), "gates", [
    { id: "safe",   text: { sv: "Kassaskåpet ska bara gå upp när båda vakterna vrider om sin nyckel.", en: "The safe should open only when both guards turn their key." } },
    { id: "stairs", text: { sv: "Trappljuset ska gå att tända och släcka från båda brytarna.", en: "The stair light should switch on and off from either switch." } },
    { id: "alarm",  text: { sv: "Lampan på lådan ska lysa tills någon trycker på en knapp.", en: "The lamp on the box should stay on until someone presses a button." } }
  ], { onComplete: () => { const g = $("glow"); g.classList.remove("blink"); void g.getBBox(); g.classList.add("blink"); } });

  // node-02: a Pico W with two arcade buttons and an LED. The buttons in the drawing can be pressed.
  const box = K.box($("box"), {
    node: "node-02",
    svg: `<svg viewBox="0 0 300 140" role="img" aria-label="Låda med knapparna A och B och en lampa" data-aria-en="Box with buttons A and B and a lamp">
      <rect x="10" y="14" width="280" height="116" rx="10" fill="var(--logic)"/>
      <rect x="18" y="8" width="264" height="108" rx="8" fill="var(--graphite)"/>
      <g id="hw-a" class="hw-press" tabindex="0" role="button" aria-label="Knapp A" data-aria-en="Button A"><circle cx="70" cy="58" r="24" fill="var(--on-graphite)"/><circle id="hw-a-in" cx="70" cy="58" r="16" fill="var(--grid)"/></g>
      <g id="hw-b" class="hw-press" tabindex="0" role="button" aria-label="Knapp B" data-aria-en="Button B"><circle cx="140" cy="58" r="24" fill="var(--on-graphite)"/><circle id="hw-b-in" cx="140" cy="58" r="16" fill="var(--grid)"/></g>
      <circle id="hw-glow" cx="228" cy="58" r="30" fill="var(--logic)" opacity="0"/>
      <circle id="hw-led" class="hw-led" cx="228" cy="58" r="14"/>
      <text class="hw-text-light" x="66" y="104">A</text><text class="hw-text-light" x="136" y="104">B</text>
    </svg>`,
    onConnect: () => render()
  });

  const out = () => GATES[state.gate].fn(state.a, state.b);
  const key = (a, b) => (a ? 1 : 0) + "" + (b ? 1 : 0);
  const ALL = ["00", "01", "10", "11"];

  function wires() {
    if (GATES[state.gate].two) {
      $("wa").setAttribute("d", "M190,115 H290 Q300,115 300,125 V170 Q300,175 310,175 H345");
      $("wb").setAttribute("d", "M190,295 H290 Q300,295 300,285 V230 Q300,225 310,225 H345");
    } else {
      $("wa").setAttribute("d", "M190,115 H290 Q300,115 300,125 V190 Q300,200 310,200 H345");
      $("wb").setAttribute("d", "M190,295 H240");
    }
  }
  function renderGatePicker() {
    const wrap = $("gates"); wrap.innerHTML = "";
    Object.entries(GATES).forEach(([k, g]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "gate-btn"; b.setAttribute("aria-pressed", k === state.gate);
      b.innerHTML = `<svg viewBox="0 0 60 40" aria-hidden="true">${ICONS[k]}</svg><b>${K.t(g)}</b>`;
      b.addEventListener("click", () => { state.gate = k; state.seen = new Set(); state.seenOnBox = new Set(); render(); });
      wrap.append(b);
    });
  }
  function renderTruth() {
    const g = GATES[state.gate];
    const tb = $("truth").querySelector("tbody"); tb.innerHTML = "";
    const rows = g.two ? [[0, 0], [0, 1], [1, 0], [1, 1]] : [[0, null], [1, null]];
    rows.forEach(([a, b]) => {
      const k = g.two ? key(a, b) : key(a, false);
      const tr = document.createElement("tr");
      if (!!a === state.a && (b === null || !!b === state.b)) tr.className = "now";
      const led = v => `<span class="led ${v ? "on" : ""}"></span><span>${v ? 1 : 0}</span>`;
      tr.innerHTML = `<td>${led(a)}</td><td>${b === null ? "–" : led(b)}</td><td>${state.seen.has(k) ? led(g.fn(!!a, !!b)) : '<span class="unknown">?</span>'}</td>`;
      tb.append(tr);
    });
  }

  function render() {
    const g = GATES[state.gate], o = out(), on = box.connected();
    state.seen.add(g.two ? key(state.a, state.b) : key(state.a, false));
    if (on) state.seenOnBox.add(key(state.a, state.b));
    $("swA").classList.toggle("on", state.a); $("swA").setAttribute("aria-checked", state.a);
    $("swB").classList.toggle("on", state.b); $("swB").setAttribute("aria-checked", state.b);
    $("swB").classList.toggle("disabled", !g.two);
    $("bitA").textContent = state.a ? 1 : 0; $("bitB").textContent = state.b ? 1 : 0; $("bitO").textContent = o ? 1 : 0;
    wires();
    $("wa").classList.toggle("on", state.a);
    $("wb").classList.toggle("on", state.b && g.two);
    $("wo").classList.toggle("on", o);
    $("lamp").classList.toggle("on", o); $("glow").classList.toggle("on", o);
    $("gate").setAttribute("d", g.d);
    $("gate-extra").setAttribute("d", g.extra || "");
    $("gate-bubble").style.display = g.bubble ? "" : "none";
    $("gate-bubble").setAttribute("cx", state.gate === "nor" ? 454 : 444);
    $("wo").setAttribute("d", state.gate === "not" ? "M452,200 H650" : "M462,200 H650");
    $("gate-name").textContent = K.t(g);
    $("hw-a-in").setAttribute("fill", on && state.a ? "var(--logic)" : "var(--grid)");
    $("hw-b-in").setAttribute("fill", on && state.b && g.two ? "var(--logic)" : "var(--grid)");
    $("hw-led").classList.toggle("on", on && o); $("hw-glow").setAttribute("opacity", on && o ? .35 : 0);
    renderGatePicker();
    renderTruth();
    const all = g.two && ALL.every(k => state.seen.has(k));
    if (all && state.gate === "and") tasks.complete("safe");
    if (all && state.gate === "xor") tasks.complete("stairs");
    if (on && state.gate === "nor" && ALL.every(k => state.seenOnBox.has(k))) tasks.complete("alarm");
  }

  function flip(prop, fromBox) {
    if (prop === "b" && !GATES[state.gate].two) return;
    if (fromBox && !box.connected()) return;
    state[prop] = !state[prop];
    render();
  }
  [["swA", "a", false], ["swB", "b", false], ["hw-a", "a", true], ["hw-b", "b", true]].forEach(([id, prop, fromBox]) => {
    const el = $(id);
    el.addEventListener("click", () => flip(prop, fromBox));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(prop, fromBox); } });
  });
  K.onLang(render);
  render();
})();
</script>
</body>
</html>
