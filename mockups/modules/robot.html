<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robotens väg – Verkstan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .chip .tick { width: 16px; height: 16px; }
  .chip .tick path { fill: none; stroke: var(--active); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .cell { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .tree-top { fill: var(--grid); stroke: var(--graphite); stroke-width: 2.5; }
  .tree-trunk { stroke: var(--graphite); stroke-width: 3; stroke-linecap: round; }
  .star { fill: var(--active); stroke: var(--graphite); stroke-width: 2.5; stroke-linejoin: round; }
  #robot { transition: transform .42s var(--ease); }
  #robot .body { fill: var(--sheet); stroke: var(--graphite); stroke-width: 3; }
  #robot .wheel { fill: var(--graphite); }
  #robot .nose { fill: var(--active); stroke: var(--graphite); stroke-width: 2; stroke-linejoin: round; }
  #robot.bump .inner { animation: bump .4s var(--ease); }
  @keyframes bump { 30% { transform: translateX(10px); } 60% { transform: translateX(-4px); } }
  .trail { fill: var(--active); opacity: .35; }
  .crash { fill: none; stroke: var(--graphite); stroke-width: 3; stroke-linecap: round; }

  .blk {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px 0 10px;
    border-radius: 6px; border: 1px solid var(--graphite); background: var(--sheet); color: var(--graphite);
    font-weight: 700; cursor: pointer; transition: transform var(--fast) var(--ease), background var(--fast);
  }
  .blk:active { transform: translateY(1px); }
  .blk svg { width: 24px; height: 24px; flex: none; }
  .blk svg path { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .blk .times { font-family: var(--font-num); font-weight: 600; padding-left: 8px; border-left: 1px solid var(--line); }
  .blk .remove { width: 20px; height: 20px; margin-left: 2px; display: grid; place-items: center; color: var(--pencil); }
  .blk .remove svg { width: 12px; height: 12px; }
  .blk.running { border: 2px solid var(--graphite); background: color-mix(in srgb, var(--active) 16%, var(--sheet)); }
  .blk.error { border: 2px solid var(--graphite); position: relative; overflow: hidden; padding-left: 22px; }
  .blk.error::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 12px; background: var(--tape-stripes); }
  .program-box { padding: 12px; border-radius: 6px; border: 1px solid var(--line); min-height: 76px; display: grid; gap: 8px; }
  .program .nr { font-family: var(--font-num); font-weight: 400; color: var(--pencil); font-size: 14px; }
  .empty { color: var(--pencil); font-size: var(--fs-small); border: 1px dashed var(--line); border-radius: 6px; padding: 12px; }
  .count { font-family: var(--font-num); font-size: var(--fs-small); color: var(--pencil); }
  .count.over { color: var(--graphite); font-weight: 600; }
</style>
</head>
<body data-domain="code">
<header class="topbar" data-title-sv="Robotens väg" data-title-en="The robot's path"></header>

<main class="module">
  <section class="stage">
    <div class="row" id="levels"></div>
    <div class="scene">
      <svg id="world" viewBox="0 0 560 400" role="img" aria-label="Ett rutnät med en robot, träd och en stjärna" data-aria-en="A grid with a robot, trees and a star">
        <g id="grid"></g><g id="trail"></g><g id="things"></g>
        <g id="robot"><g class="inner">
          <rect class="wheel" x="-20" y="-32" width="26" height="9" rx="2"/><rect class="wheel" x="-20" y="23" width="26" height="9" rx="2"/>
          <rect class="body" x="-26" y="-25" width="50" height="50" rx="8"/>
          <path class="nose" d="M10 -9 L24 0 L10 9 Z"/>
        </g></g>
        <g id="crash"></g>
      </svg>
    </div>

    <div class="row" id="palette"></div>
    <div class="program-box">
      <div class="row program" id="program"></div>
    </div>
    <div class="row between">
      <div class="row"><span class="count" id="count"></span><button class="chip" id="peek" type="button" aria-pressed="false" hidden data-en="Show the course">Visa banan</button></div>
      <div class="row">
        <button class="btn ghost" id="clear" type="button" data-en="Clear">Rensa</button>
        <button class="btn" id="run" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2v12L14 8z" fill="currentColor"/></svg>
          <span data-en="Run">Kör</span></button>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="mission" id="mission">
      <p class="meta" data-en="Software · 2–4 people · 20 min">Mjukvara · 2–4 personer · 20 min</p>
      <h2 data-en="Programme the robot">Programmera roboten</h2>
    </div>

    <details class="why">
      <summary data-en="What happened?">Vad hände?</summary>
      <div class="body">
        <p data-en="A <b>program</b> is instructions in order, and the robot follows them exactly. Forward ×4 is a small <b>loop</b>.">Ett <b>program</b> är instruktioner i ordning, och roboten följer dem exakt. Framåt ×4 är en liten <b>loop</b>.</p>
      </div>
    </details>

    <div id="box"></div>
  </aside>
</main>

<script src="../shared/kit.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const C = 80, COLS = 7, ROWS = 5;
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];  // east, south, west, north
  const LEVELS = [
    { id: "n1", start: [0, 2, 0], star: [5, 2], trees: [[2, 0], [3, 4], [6, 1]], max: null },
    { id: "n2", start: [0, 4, 0], star: [2, 1], trees: [[0, 2], [3, 4], [3, 2], [1, 0], [5, 1]], max: null },
    { id: "n3", start: [0, 4, 0], star: [6, 0], trees: [[1, 2], [2, 0], [2, 3], [6, 2], [5, 3], [6, 4], [3, 1]], max: 5 },
    { id: "n4", start: [0, 0, 1], star: [6, 4], trees: [[0, 3], [1, 1], [2, 2], [3, 0], [4, 3], [5, 1], [6, 3]], max: null, hidden: true }
  ];
  const ICON = {
    fwd: '<path d="M12 20V5M6 10.5 12 4.5l6 6"/>',
    left: '<path d="M18 20v-6a5 5 0 0 0-5-5H6M10 5 6 9l4 4"/>',
    right: '<path d="M6 20v-6a5 5 0 0 1 5-5h7M14 5l4 4-4 4"/>'
  };
  const NAME = { fwd: { sv: "Framåt", en: "Forward" }, left: { sv: "Sväng vänster", en: "Turn left" }, right: { sv: "Sväng höger", en: "Turn right" } };
  const TICK = '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>';
  const CROSS = '<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  const cleared = new Set();
  const s = { lvl: 0, prog: [], running: false, pos: null, errAt: -1, peek: false };
  const tasks = K.tasks($("mission"), "robot", [
    { id: "n3",   text: { sv: "Nå stjärnan på nivå 3 med högst fem block.", en: "Reach the star on level 3 with five blocks at most." } },
    { id: "n4",   text: { sv: "Nivå 4: en i laget ser banan och beskriver den. De andra bygger programmet utan att titta.", en: "Level 4: one person sees the course and describes it. The others build the program without looking." } },
    { id: "real", text: { sv: "Kör nivå 3 på den riktiga roboten så att den stannar på stjärnan.", en: "Run level 3 on the real robot so that it stops on the star." } }
  ]);

  // node-06: a small two-wheeled robot on a floor mat printed with level 3
  const box = K.box($("box"), {
    node: "node-06",
    svg: `<svg viewBox="0 0 300 150" role="img" aria-label="Robot sedd uppifrån på en golvmatta" data-aria-en="Robot seen from above on a floor mat">
      <rect class="hw-board" x="8" y="6" width="284" height="138" rx="6"/>
      ${Array.from({ length: 8 }, (_, i) => `<line x1="${24 + i * 36}" y1="16" x2="${24 + i * 36}" y2="134" stroke="var(--line)" stroke-width="1.5"/>`).join("")}
      ${Array.from({ length: 6 }, (_, i) => `<line x1="24" y1="${16 + i * 23.6}" x2="276" y2="${16 + i * 23.6}" stroke="var(--line)" stroke-width="1.5"/>`).join("")}
      <g id="hw-robot" style="transition:transform .42s var(--ease)">
        <rect x="-11" y="-13" width="12" height="4" rx="1" fill="var(--graphite)"/><rect x="-11" y="9" width="12" height="4" rx="1" fill="var(--graphite)"/>
        <rect class="hw-chip" x="-12" y="-9" width="22" height="18" rx="3"/>
        <circle id="hw-led" class="hw-led" cx="5" cy="0" r="3"/>
      </g>
    </svg>`
  });

  const L = () => LEVELS[s.lvl];
  const isTree = (x, y) => L().trees.some(([a, b]) => a === x && b === y);
  const px = v => v * C + C / 2;

  const hide = () => L().hidden && !s.peek;
  function drawWorld() {
    const g = $("grid"); g.innerHTML = "";
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x", x * C); r.setAttribute("y", y * C); r.setAttribute("width", C); r.setAttribute("height", C); r.setAttribute("class", "cell");
      g.append(r);
    }
    const t = $("things"); t.innerHTML = "";
    $("peek").hidden = !L().hidden; $("peek").setAttribute("aria-pressed", s.peek);
    if (hide()) { $("trail").innerHTML = ""; $("crash").innerHTML = ""; resetRobot(); return; }
    L().trees.forEach(([x, y]) => {
      t.insertAdjacentHTML("beforeend", `<g><line class="tree-trunk" x1="${px(x)}" y1="${px(y) + 4}" x2="${px(x)}" y2="${px(y) + 28}"/>
        <circle class="tree-top" cx="${px(x)}" cy="${px(y) - 4}" r="22"/></g>`);
    });
    const [sx, sy] = L().star, cx = px(sx), cy = px(sy);
    const pts = Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 11 : 26, a = -Math.PI / 2 + i * Math.PI / 5; return (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1); }).join(" ");
    t.insertAdjacentHTML("beforeend", `<polygon class="star" points="${pts}"/>`);
    $("trail").innerHTML = ""; $("crash").innerHTML = "";
    resetRobot();
  }
  function resetRobot() {
    const [x, y, d] = L().start; s.pos = { x, y, d, rot: d * 90 };
    placeRobot(true);
  }
  function placeRobot(instant) {
    const els = [$("robot"), $("hw-robot")];
    if (instant) els.forEach(el => el.style.transition = "none");
    els[0].style.transform = `translate(${px(s.pos.x)}px, ${px(s.pos.y)}px) rotate(${s.pos.rot}deg)`;
    els[1].style.transform = `translate(${42 + s.pos.x * 36}px, ${27.8 + s.pos.y * 23.6}px) rotate(${s.pos.rot}deg)`;
    if (instant) { els[0].getBoundingClientRect(); els.forEach(el => el.style.transition = ""); }
  }

  function renderLevels() {
    const w = $("levels"); w.innerHTML = "";
    LEVELS.forEach((lv, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", i === s.lvl);
      b.innerHTML = `${K.t("Nivå", "Level")} ${i + 1}${cleared.has(lv.id) || tasks.isDone(lv.id) ? TICK : ""}`;
      b.addEventListener("click", () => { if (s.running) return; s.lvl = i; s.prog = []; s.errAt = -1; s.peek = false; renderAll(); });
      w.append(b);
    });
  }
  function block(type, times, onClick, nr) {
    const b = document.createElement("button"); b.type = "button"; b.className = "blk";
    b.innerHTML = `${nr ? `<span class="nr">${nr}</span>` : ""}<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[type]}</svg><span>${K.t(NAME[type])}</span>${times > 1 ? `<span class="times">×${times}</span>` : ""}${nr ? `<span class="remove" aria-hidden="true">${CROSS}</span>` : ""}`;
    if (nr) b.setAttribute("aria-label", `${nr}. ${K.t(NAME[type])}${times > 1 ? " ×" + times : ""}`);
    b.addEventListener("click", onClick);
    return b;
  }
  function renderPalette() {
    const p = $("palette"); p.innerHTML = "";
    ["fwd", "left", "right"].forEach(t => p.append(block(t, 1, () => { if (s.running) return; s.prog.push({ t, n: 1 }); s.errAt = -1; renderProgram(); })));
  }
  function renderProgram() {
    const p = $("program"); p.innerHTML = "";
    if (!s.prog.length) p.innerHTML = `<span class="empty" aria-hidden="true">&nbsp;</span>`;
    s.prog.forEach((b, i) => {
      const el = block(b.t, b.n, e => {
        if (s.running) return;
        if (e.target.closest(".remove")) s.prog.splice(i, 1);
        else if (b.t === "fwd") b.n = b.n % 5 + 1;
        s.errAt = -1; renderProgram();
      }, i + 1);
      el.dataset.i = i;
      if (i === s.errAt) el.classList.add("error");
      p.append(el);
    });
    const max = L().max, n = s.prog.length;
    $("count").textContent = max ? K.t(`${n} av högst ${max} block`, `${n} of at most ${max} blocks`) : K.t(`${n} block`, `${n} blocks`);
    $("count").classList.toggle("over", !!max && n > max);
  }
  function renderAll() { renderLevels(); drawWorld(); renderPalette(); renderProgram(); }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function run() {
    if (s.running || !s.prog.length) return;
    s.running = true; s.errAt = -1; renderProgram(); resetRobot(); $("trail").innerHTML = ""; $("crash").innerHTML = "";
    const real = box.connected() && s.lvl === 2;
    $("hw-led").classList.toggle("on", real);
    await wait(250);
    let crash = null;
    outer: for (let i = 0; i < s.prog.length; i++) {
      const b = s.prog[i];
      const el = $("program").querySelector(`[data-i="${i}"]`); el && el.classList.add("running");
      for (let k = 0; k < b.n; k++) {
        if (b.t === "left") { s.pos.d = (s.pos.d + 3) % 4; s.pos.rot -= 90; }
        else if (b.t === "right") { s.pos.d = (s.pos.d + 1) % 4; s.pos.rot += 90; }
        else {
          const [dx, dy] = DIRS[s.pos.d], nx = s.pos.x + dx, ny = s.pos.y + dy;
          const edge = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
          if (edge || isTree(nx, ny)) {
            $("robot").classList.remove("bump"); void $("robot").getBoundingClientRect(); $("robot").classList.add("bump");
            const kx = (px(s.pos.x) + px(nx)) / 2, ky = (px(s.pos.y) + px(ny)) / 2;
            $("crash").innerHTML = [0, 60, 120].map(a => `<path class="crash" transform="rotate(${a} ${kx} ${ky})" d="M${kx - 10} ${ky}h20"/>`).join("");
            crash = { i, edge }; el && el.classList.remove("running"); break outer;
          }
          $("trail").insertAdjacentHTML("beforeend", `<circle class="trail" cx="${px(s.pos.x)}" cy="${px(s.pos.y)}" r="8"/>`);
          s.pos.x = nx; s.pos.y = ny;
        }
        placeRobot(); await wait(460);
      }
      el && el.classList.remove("running");
    }
    $("hw-led").classList.remove("on");
    const [sx, sy] = L().star, atStar = s.pos.x === sx && s.pos.y === sy, max = L().max;
    if (crash) { s.errAt = crash.i; renderProgram(); }
    else if (atStar && (!max || s.prog.length <= max)) {
      cleared.add(L().id);
      if (L().id === "n3") tasks.complete("n3");
      if (L().hidden && !s.peek) tasks.complete("n4");
      if (real) tasks.complete("real");
      renderLevels();
    }
    s.running = false;
  }

  $("run").addEventListener("click", run);
  $("clear").addEventListener("click", () => { if (s.running) return; s.prog = []; s.errAt = -1; renderProgram(); resetRobot(); $("trail").innerHTML = ""; $("crash").innerHTML = ""; });
  $("peek").addEventListener("click", () => { if (s.running) return; s.peek = !s.peek; drawWorld(); });
  K.onLang(() => { renderLevels(); renderPalette(); renderProgram(); });

  // one block to start with, so the idea shows at once
  s.prog = [{ t: "fwd", n: 2 }];
  renderAll();
})();
</script>
</body>
</html>
