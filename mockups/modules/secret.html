<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hemliga färger – Verkstan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .table { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 16px 12px; }
  .col { display: grid; align-content: start; gap: 10px; justify-items: center; text-align: center; }
  .col h3 { font-size: var(--fs-body); }
  .col.middle { border-inline: 1px dashed var(--line); padding-inline: 6px; }
  .jar { width: min(100%, 92px); aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--graphite); background: var(--sheet); display: grid; place-items: center; font-family: var(--font-num); font-size: 22px; transition: background var(--calm); }
  .jar.empty { border-style: dashed; border-color: var(--line); }
  .jar.hidden { background: repeating-linear-gradient(45deg, var(--grid) 0 6px, var(--sheet) 6px 12px); }
  .jar.small { width: 44px; }
  .palette .chip { width: 44px; padding: 0; justify-content: center; }
  .palette .chip i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--graphite); }
  @media (max-width: 560px) { .jar { font-size: 16px; } }
  .chest-lid { transition: transform .6s var(--ease); transform-origin: 100px 62px; }
  .open .chest-lid { transform: rotate(-32deg); }
</style>
</head>
<body data-domain="net">
<header class="topbar" data-title-sv="Hemliga färger" data-title-en="Secret colours"></header>

<main class="module">
  <section class="stage">
    <div class="scene table" id="table"></div>
    <p class="status" aria-live="polite" role="status"></p>
    <div class="row palette" id="palette"></div>
    <div class="row">
      <button class="btn" id="step" type="button"></button>
      <button class="btn ghost" id="eve" type="button" data-en="Let the eavesdropper try">Låt tjuvlyssnaren försöka</button>
      <button class="btn ghost" id="restart" type="button" data-en="Start over">Börja om</button>
    </div>
  </section>

  <aside class="panel">
    <div class="mission" id="mission">
      <p class="meta" data-en="Networks · 2–4 people · 20 min">Nätverk · 2–4 personer · 20 min</p>
      <h2 data-en="A secret in the open">En hemlighet i det öppna</h2>
    </div>
    <details class="why">
      <summary data-en="What happened?">Vad hände?</summary>
      <div class="body">
        <p data-en="Paint is easy to mix and almost impossible to separate, so a secret can be shared over an open line. Every https page does the same with large numbers.">Färg är lätt att blanda och nästan omöjlig att ta isär, så en hemlighet går att dela över en öppen linje. Varje https-sida gör samma sak med stora tal.</p>
      </div>
    </details>
    <div id="box"></div>
  </aside>
</main>

<script src="../shared/kit.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const COLOURS = {
    yellow: { rgb: [250, 214, 60],  sv: "gul",    en: "yellow" },
    red:    { rgb: [214, 52, 52],   sv: "röd",    en: "red" },
    blue:   { rgb: [40, 92, 210],   sv: "blå",    en: "blue" },
    pink:   { rgb: [240, 140, 190], sv: "rosa",   en: "pink" },
    teal:   { rgb: [40, 190, 180],  sv: "turkos", en: "teal" },
    purple: { rgb: [130, 60, 170],  sv: "lila",   en: "purple" },
    white:  { rgb: [245, 245, 240], sv: "vit",    en: "white" }
  };
  const ALL = Object.keys(COLOURS);
  // a mix is a list of colours; the result is a geometric mean, as when paint is mixed
  const blend = list => [0, 1, 2].map(c => Math.round(Math.exp(list.reduce((a, f) => a + Math.log(COLOURS[f].rgb[c]), 0) / list.length)));
  const css = l => `rgb(${blend(l)})`;
  const same = (a, b) => blend(a).every((v, i) => Math.abs(v - blend(b)[i]) < 3);

  const fresh = pub => { const others = ALL.filter(f => f !== pub); return { pub, you: null, friend: others[Math.floor(Math.random() * others.length)], step: 0, eve: null }; };
  let s = fresh("yellow");

  const tasks = K.tasks($("mission"), "secret", [
    { id: "agree", text: { sv: "Kom överens om en färg med vännen utan att tjuvlyssnaren får fram den.", en: "Agree on a colour with your friend without the eavesdropper working it out." } },
    { id: "leak",  text: { sv: "Välj en hemlig färg som låter tjuvlyssnaren lyckas.", en: "Pick a secret colour that lets the eavesdropper succeed." } },
    { id: "chest", text: { sv: "Öppna kistan på lådan med er gemensamma färg.", en: "Open the chest on the box with your shared colour." } }
  ]);

  // node-13: a chest with a servo lock and an RGB LED. Connected, the chest is the friend and picks the public colour.
  const box = K.box($("box"), {
    node: "node-13",
    svg: `<svg viewBox="0 0 300 130" role="img" aria-label="En kista med lås och en färglampa" data-aria-en="A chest with a lock and a colour lamp">
      <rect class="hw-board" x="8" y="8" width="284" height="114" rx="6"/>
      <g id="hw-chest">
        <rect x="100" y="62" width="100" height="48" rx="4" fill="var(--sheet)" stroke="var(--graphite)" stroke-width="2.5"/>
        <g class="chest-lid"><path d="M100 62 V48 Q150 26 200 48 V62 Z" fill="var(--sheet)" stroke="var(--graphite)" stroke-width="2.5"/></g>
        <rect x="144" y="70" width="12" height="14" rx="2" fill="var(--graphite)"/>
      </g>
      <circle id="hw-rgb" cx="246" cy="66" r="14" stroke="var(--graphite)" stroke-width="2" fill="var(--grid)"/>
      <rect class="hw-chip" x="24" y="44" width="56" height="44" rx="4"/><text class="hw-text-light" x="30" y="70">PICO W</text>
    </svg>`,
    onConnect: on => { s = fresh(on ? ALL[Math.floor(Math.random() * ALL.length)] : "yellow"); paint(); }
  });
  const open = document.createElement("button");
  open.className = "btn"; open.type = "button";
  box.root.querySelector(".plan").after(open);
  open.addEventListener("click", () => {
    const ok = s.step === 2 && !(s.eve && s.eve.ok);
    $("hw-chest").classList.toggle("open", ok);
    if (ok) tasks.complete("chest");
    else K.status(K.t("Kistan är låst.", "The chest is locked."), "danger");
  });

  ALL.forEach(f => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.f = f;
    b.innerHTML = `<i style="background:rgb(${COLOURS[f].rgb})"></i>`;
    b.addEventListener("click", () => { if (s.step === 0) { s.you = f; paint(); } });
    $("palette").append(b);
  });

  const jar = (list, hidden, cls = "") => `<div class="jar ${cls}${list ? "" : " empty"}${hidden ? " hidden" : ""}" style="${list && !hidden ? `background:${css(list)}` : ""}">${hidden ? "?" : ""}</div>`;

  // the eavesdropper sees both mixes. If one secret is the public colour, that mix gives the game away.
  function eavesdrop() {
    const shared = [s.pub, s.you, s.friend];
    let guess = [s.pub, s.pub, s.you, s.friend];
    if (s.you === s.pub) guess = [s.pub, s.pub, s.friend];
    if (s.friend === s.pub) guess = [s.pub, s.you, s.pub];
    return { guess, ok: same(guess, shared) };
  }

  function paint() {
    const yours = [s.pub, s.you], theirs = [s.pub, s.friend], shared = [s.pub, s.you, s.friend];
    const you = s.step === 0 ? jar(s.you && [s.you]) : jar(s.step === 1 ? yours : shared);
    const friend = s.step === 0 ? jar([s.friend], true) : jar(s.step === 1 ? theirs : shared);
    const middle = s.step === 0 ? jar([s.pub])
      : `<div class="row" style="justify-content:center;gap:6px">${jar(yours, false, "small")}${jar(theirs, false, "small")}</div>${s.eve ? jar(s.eve.guess) : ""}`;
    $("table").innerHTML = `<div class="col"><h3>${K.t("Ni", "You")}</h3>${you}</div>
      <div class="col middle"><h3>${K.t("Öppet nät", "Open network")}</h3>${middle}</div>
      <div class="col"><h3>${box.connected() ? "node-13" : K.t("Vännen", "Friend")}</h3>${friend}</div>`;

    document.querySelectorAll("[data-f]").forEach(b => { b.setAttribute("aria-pressed", b.dataset.f === s.you); b.setAttribute("aria-label", K.t(COLOURS[b.dataset.f])); b.disabled = s.step > 0; });
    $("step").textContent = [K.t("Blanda och skicka", "Mix and send"), K.t("Blanda i er hemlighet", "Mix in your secret"), K.t("Klart", "Done")][s.step];
    $("step").disabled = !s.you || s.step === 2;
    $("eve").disabled = s.step === 0 || !!s.eve;
    const on = box.connected();
    open.hidden = !on; open.textContent = K.t("Öppna kistan", "Open the chest");
    $("hw-rgb").setAttribute("fill", on ? css(s.step === 0 ? [s.pub] : theirs) : "var(--grid)");
    if (!on) $("hw-chest").classList.remove("open");
  }

  $("step").addEventListener("click", () => { s.step++; paint(); });
  $("eve").addEventListener("click", () => {
    s.eve = eavesdrop(); paint();
    if (s.eve.ok) { K.status(K.t("Tjuvlyssnaren har er färg.", "The eavesdropper has your colour."), "danger"); tasks.complete("leak"); }
    else { K.status(K.t("Tjuvlyssnaren fick fel färg.", "The eavesdropper got the wrong colour.")); if (s.step === 2) tasks.complete("agree"); }
  });
  $("restart").addEventListener("click", () => { s = fresh(s.pub); $("hw-chest").classList.remove("open"); K.status(""); paint(); });
  K.onLang(paint);
  paint();
})();
</script>
</body>
</html>
