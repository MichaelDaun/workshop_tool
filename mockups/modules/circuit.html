<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strömkretsen – Verkstan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .circuit { user-select: none; touch-action: manipulation; }
  .wire { fill: none; stroke: var(--graphite); stroke-width: 4; stroke-linejoin: round; transition: stroke-width .5s var(--ease), stroke .5s var(--ease); }
  .water .wire { stroke: color-mix(in srgb, var(--net) 30%, var(--sheet)); stroke-width: 28; }
  .pipe-edge { fill: none; stroke: var(--net); stroke-width: 32; opacity: 0; stroke-linejoin: round; transition: opacity .5s var(--ease); }
  .water .pipe-edge { opacity: .3; }
  .electron { fill: var(--active); }
  .water .electron { fill: var(--net); }
  .mask { fill: var(--sheet); }
  .part-label { font-family: var(--font-text); font-weight: 700; font-size: 19px; fill: var(--graphite); }
  .part-sub { font-family: var(--font-num); font-size: 17px; fill: var(--pencil); }
  @media (max-width: 600px) { .part-label { font-size: 28px; } .part-sub { font-size: 24px; } }
  .elec-only, .water-only { transition: opacity .4s var(--ease); }
  .water .elec-only { opacity: 0; pointer-events: none; }
  .water-only { opacity: 0; pointer-events: none; }
  .water .water-only { opacity: 1; pointer-events: auto; }
  .cell { fill: var(--sheet); stroke: var(--graphite); stroke-width: 2.5; }
  .cell-plus { fill: var(--active); }
  .glass { fill: var(--sheet); stroke: var(--graphite); stroke-width: 3; }
  .broken .glass { fill: var(--grid); stroke-dasharray: 7 5; }
  .filament { fill: none; stroke: var(--graphite); stroke-width: 2.5; }
  .crack { stroke: var(--graphite); stroke-width: 2; opacity: 0; }
  .broken .crack { opacity: 1; }
  #glowc.blink { animation: blink .7s var(--ease); }
  @keyframes blink { 40% { opacity: 1; } }
  .switch-hit { cursor: pointer; fill: transparent; outline: none; }
  .switch-hit:focus-visible { stroke: var(--graphite); stroke-width: 2; stroke-dasharray: 4 4; }
  .lever { stroke: var(--graphite); stroke-width: 5; stroke-linecap: round; transition: transform .3s var(--ease); transform-origin: 360px 380px; }
  .open .lever { transform: rotate(-28deg); }
  .term { fill: var(--sheet); stroke: var(--graphite); stroke-width: 3; }
  .hint-ring { fill: none; stroke: var(--graphite); stroke-width: 2; stroke-dasharray: 5 6; animation: spin 6s linear infinite; transform-origin: 400px 380px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pump-blade, .wheel-spoke { stroke: var(--net); stroke-width: 5; stroke-linecap: round; }
  .pump-body, .wheel-rim { fill: var(--sheet); stroke: var(--net); stroke-width: 4; }
</style>
</head>
<body data-domain="power">
<header class="topbar" data-title-sv="Strömkretsen" data-title-en="The circuit"></header>

<main class="module">
  <section class="stage">
    <div class="scene">
      <svg class="circuit" id="circuit" viewBox="0 0 800 460" role="img" aria-label="En strömkrets med batterier, motstånd, lampa och strömbrytare" data-aria-en="A circuit with batteries, a resistor, a bulb and a switch">
        <defs>
          <radialGradient id="glow">
            <stop offset="0" stop-color="var(--power)" stop-opacity=".9"/>
            <stop offset=".5" stop-color="var(--power)" stop-opacity=".3"/>
            <stop offset="1" stop-color="var(--power)" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path class="pipe-edge" d="M120,230 V80 H680 V380 H120 Z"/>
        <path id="loop" class="wire" d="M120,230 V80 H680 V380 H120 Z"/>
        <g id="electrons"></g>

        <g id="battery">
          <rect class="mask" id="batt-mask" x="78" y="140" width="84" height="180"/>
          <g class="elec-only" id="cells"></g>
          <g class="water-only">
            <circle class="pump-body" cx="120" cy="230" r="46"/>
            <g id="impeller" style="transform-origin:120px 230px">
              <line class="pump-blade" x1="120" y1="230" x2="120" y2="196"/>
              <line class="pump-blade" x1="120" y1="230" x2="149" y2="247"/>
              <line class="pump-blade" x1="120" y1="230" x2="91" y2="247"/>
            </g>
          </g>
          <text class="part-label" x="20" y="128" id="lbl-batt"></text>
          <text class="part-sub" x="20" y="356" id="sub-batt"></text>
        </g>

        <g id="resistor">
          <rect class="mask" x="320" y="60" width="160" height="40"/>
          <path class="elec-only wire" id="zigzag" d=""/>
          <g class="water-only"><path id="narrow" fill="color-mix(in srgb, var(--net) 30%, var(--sheet))" stroke="var(--net)" stroke-width="3" d=""/></g>
          <text class="part-label" x="400" y="40" text-anchor="middle" id="lbl-res"></text>
          <text class="part-sub" x="400" y="128" text-anchor="middle" id="sub-res"></text>
        </g>

        <g id="bulb">
          <circle id="glowc" cx="680" cy="230" r="150" fill="url(#glow)" opacity="0"/>
          <rect class="mask" x="636" y="176" width="88" height="108" rx="40"/>
          <g class="elec-only">
            <circle class="glass" cx="680" cy="222" r="42"/>
            <rect x="664" y="262" width="32" height="20" rx="3" fill="var(--grid)" stroke="var(--graphite)" stroke-width="3"/>
            <path class="filament" d="M668 262 V230 l6 -10 l6 10 l6 -10 l6 10 V262"/>
            <path class="crack" d="M656 200 l14 12 l-8 10 l16 8 M700 196 l-10 16 l12 6"/>
          </g>
          <g class="water-only">
            <circle class="wheel-rim" cx="680" cy="230" r="46"/>
            <g id="wheel" style="transform-origin:680px 230px">
              <line class="wheel-spoke" x1="680" y1="188" x2="680" y2="272"/>
              <line class="wheel-spoke" x1="638" y1="230" x2="722" y2="230"/>
              <line class="wheel-spoke" x1="650" y1="200" x2="710" y2="260"/>
              <line class="wheel-spoke" x1="710" y1="200" x2="650" y2="260"/>
            </g>
          </g>
          <text class="part-label" x="780" y="150" text-anchor="end" id="lbl-bulb"></text>
          <text class="part-sub" x="780" y="320" text-anchor="end" id="sub-bulb"></text>
        </g>

        <g id="switch" class="open">
          <rect class="mask" x="350" y="360" width="100" height="40"/>
          <circle class="hint-ring" id="switch-hint" cx="400" cy="380" r="44"/>
          <line class="lever" x1="360" y1="380" x2="440" y2="380"/>
          <circle class="term" cx="360" cy="380" r="7"/>
          <circle class="term" cx="440" cy="380" r="7"/>
          <text class="part-label" x="400" y="444" text-anchor="middle" id="lbl-sw"></text>
          <rect class="switch-hit" id="switch-hit" x="330" y="320" width="140" height="90" tabindex="0" role="button" aria-label="Strömbrytare" data-aria-en="Switch"/>
        </g>
      </svg>
    </div>

    <div class="controls">
      <div class="control" style="flex:0 0 auto; min-width:0">
        <label data-en="Batteries">Batterier</label>
        <div class="stepper">
          <button id="minus" type="button" aria-label="Färre batterier" data-aria-en="Fewer batteries">−</button>
          <output id="o-batt">2</output>
          <button id="plus" type="button" aria-label="Fler batterier" data-aria-en="More batteries">+</button>
        </div>
      </div>
      <div class="control">
        <label for="res" data-en="Resistance">Motstånd</label>
        <input type="range" id="res" min="0.5" max="20" step="0.5" value="10">
      </div>
      <div class="row">
        <button class="chip" id="water-btn" type="button" aria-pressed="false" style="min-height:48px" data-en="Show as water">Visa som vatten</button>
        <button class="btn" id="replace" type="button" hidden data-en="New bulb">Ny lampa</button>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="mission" id="mission">
      <p class="meta" data-en="Electricity · 2–4 people · 20 min">Ellära · 2–4 personer · 20 min</p>
      <h2 data-en="Exactly one ampere">Exakt en ampere</h2>
    </div>

    <details class="why">
      <summary data-en="What happened?">Vad hände?</summary>
      <div class="body">
        <p data-en="The bulb resists too, with 3 Ω. The current is the voltage divided by all the resistance in the loop.">Lampan bromsar också, med 3 Ω. Strömmen blir spänningen delad med allt motstånd i kretsen.</p>
        <p class="formula" data-en="I = V ÷ (R + 3 Ω)">I = U ÷ (R + 3 Ω)</p>
      </div>
    </details>

    <div id="box"></div>
  </aside>
</main>

<script src="../shared/kit.js"></script>
<script>
(() => {
  const R_BULB = 3, BREAK = 8;          // bulb resistance in ohm, breaks above 8 W
  const BAND = [0.95, 1.05];            // "exactly 1 A"
  const $ = id => document.getElementById(id);
  const svg = $("circuit"), loop = $("loop"), L = loop.getTotalLength();
  const state = { n: 2, R: 10, closed: false, broken: false, water: false };
  const fmt = (v, d) => v.toFixed(d).replace(".", K.lang === "sv" ? "," : ".");
  const ohm = r => fmt(r, r % 1 ? 1 : 0) + " Ω";
  const inBand = I => I >= BAND[0] && I <= BAND[1];

  const tasks = K.tasks($("mission"), "circuit", [
    { id: "one-amp", text: { sv: "Få exakt 1 A genom lampan.", en: "Get exactly 1 A through the bulb." } },
    { id: "six",     text: { sv: "Gör samma sak med 6 batterier.", en: "Do the same with 6 batteries." } },
    { id: "predict", text: { sv: "Med 4 batterier: räkna ut motståndet för 1 A innan ni slår på brytaren.", en: "With 4 batteries: work out the resistance for 1 A before you flip the switch." } },
    { id: "led",     text: { sv: "Lysdioden på lådan tål 20 mA. Få den att lysa så starkt det går.", en: "The LED on the box takes 20 mA. Make it as bright as it can be." } }
  ], { onComplete: () => { const g = $("glowc"); g.classList.remove("blink"); void g.getBBox(); g.classList.add("blink"); } });

  // node-01: 5 V, 100 Ω, a 500 Ω knob and an LED in series; an INA219 measures the current
  const V_SUPPLY = 5, V_LED = 2, R_FIXED = 100, R_KNOB = 500;
  const box = K.box($("box"), {
    node: "node-01",
    svg: `<svg viewBox="0 0 300 150" role="img" aria-label="Pico W med lysdiod, vred och strömmätare" data-aria-en="Pico W with an LED, a knob and a current meter">
      <rect class="hw-board" x="8" y="10" width="284" height="130" rx="6"/>
      ${Array.from({ length: 13 }, (_, i) => Array.from({ length: 4 }, (_, j) => `<rect class="hw-hole" x="${20 + i * 21}" y="${96 + j * 10}" width="4" height="4"/>`).join("")).join("")}
      <rect class="hw-chip" x="20" y="22" width="84" height="40" rx="4"/>
      <text class="hw-text-light" x="30" y="46">PICO W</text>
      <rect class="hw-display" x="196" y="22" width="84" height="40" rx="4"/>
      <text class="hw-digits" id="hw-ma" x="238" y="48" text-anchor="middle">----</text>
      <text class="hw-text" x="238" y="78" text-anchor="middle">mA</text>
      <path class="hw-wire" d="M104 32 H196"/>
      <path class="hw-wire" d="M60 62 V110 H120"/>
      <path class="hw-wire" d="M168 110 H230 V62"/>
      <circle id="hw-glow" cx="120" cy="96" r="22" fill="var(--power)" opacity="0"/>
      <circle id="hw-led" class="hw-led" cx="120" cy="96" r="9"/>
      <g id="hw-knob" style="transform-origin:168px 96px"><circle cx="168" cy="96" r="15" fill="var(--sheet)" stroke="var(--graphite)" stroke-width="2.5"/><line x1="168" y1="96" x2="168" y2="83" stroke="var(--graphite)" stroke-width="3" stroke-linecap="round"/></g>
    </svg>`,
    onConnect: () => update()
  });
  const knob = document.createElement("input");
  Object.assign(knob, { type: "range", min: 0, max: R_KNOB, step: 1, value: 400, className: "knob" });
  knob.setAttribute("aria-label", "Vredet på lådan"); knob.dataset.ariaEn = "The knob on the box";
  box.root.querySelector(".plan").after(knob);
  knob.addEventListener("input", () => update());

  const eg = $("electrons"), N = 30;
  const dots = Array.from({ length: N }, () => { const c = document.createElementNS("http://www.w3.org/2000/svg", "circle"); c.setAttribute("class", "electron"); c.setAttribute("r", 5); eg.append(c); return c; });

  function drawCells() {
    const g = $("cells"); g.innerHTML = "";
    const h = 18, gap = 5, total = state.n * (h + gap) - gap, y0 = 230 - total / 2;
    for (let i = 0; i < state.n; i++) {
      g.insertAdjacentHTML("beforeend", `<rect class="cell" x="94" y="${y0 + i * (h + gap)}" width="52" height="${h}" rx="3"/><rect class="cell-plus" x="94" y="${y0 + i * (h + gap)}" width="10" height="${h}" rx="2"/>`);
    }
    $("batt-mask").setAttribute("y", y0 - 8); $("batt-mask").setAttribute("height", total + 16);
    $("o-batt").textContent = state.n;
  }
  function drawResistor() {
    const zigs = Math.round(3 + state.R * 0.7), x0 = 330, x1 = 470, w = (x1 - x0) / zigs, a = 13;
    let d = `M${x0 - 10},80 H${x0}`;
    for (let i = 0; i < zigs; i++) d += ` L${x0 + w * (i + .5)},${80 + (i % 2 ? a : -a)}`;
    $("zigzag").setAttribute("d", d + ` L${x1},80 H${x1 + 10}`);
    const gap = Math.max(3, 15 - state.R * 0.6);
    $("narrow").setAttribute("d", `M320,66 C350,66 360,${80 - gap} 380,${80 - gap} H420 C440,${80 - gap} 450,66 480,66 V94 C450,94 440,${80 + gap} 420,${80 + gap} H380 C360,${80 + gap} 350,94 320,94 Z`);
  }

  function physics() {
    const U = state.n * 1.5, on = state.closed && !state.broken;
    const I = on ? U / (state.R + R_BULB) : 0;
    return { U, I, P: I * I * R_BULB };
  }

  function labels(U, I) {
    const w = state.water, T = K.t;
    $("lbl-batt").textContent = w ? T("Pump", "Pump") : T("Batterier", "Batteries");
    $("sub-batt").textContent = fmt(U, 1) + " V";
    $("lbl-res").textContent = w ? T("Smalt rör", "Narrow pipe") : T("Motstånd", "Resistor");
    $("sub-res").textContent = ohm(state.R);
    $("lbl-bulb").textContent = w ? T("Vattenhjul", "Water wheel") : T("Lampa", "Bulb");
    $("sub-bulb").textContent = fmt(I, 2) + " A";
    $("lbl-sw").textContent = w ? T("Kran", "Tap") : T("Strömbrytare", "Switch");
  }

  function updateBox() {
    const on = box.connected();
    const mA = (V_SUPPLY - V_LED) / (R_FIXED + +knob.value) * 1000;
    knob.hidden = !on;
    $("hw-ma").textContent = on ? fmt(mA, 1) : "----";
    $("hw-led").classList.toggle("on", on);
    $("hw-glow").setAttribute("opacity", on ? Math.min(.7, mA / 30) : 0);
    $("hw-knob").style.transform = `rotate(${(knob.value / R_KNOB) * 270 - 135}deg)`;
    if (!on) return;
    if (mA > 20.05) K.status(K.t(`${fmt(mA, 1)} mA. Lysdioden blir för varm.`, `${fmt(mA, 1)} mA. The LED gets too hot.`), "danger");
    else if (mA >= 19) tasks.complete("led");
  }

  function update() {
    const { U, I, P } = physics();
    labels(U, I);
    $("glowc").setAttribute("opacity", state.water ? 0 : Math.min(1, P / 4.5));
    $("switch").classList.toggle("open", !state.closed);
    $("switch-hint").style.display = state.closed || tasks.isDone("one-amp") ? "none" : "";
    $("bulb").classList.toggle("broken", state.broken);
    $("replace").hidden = !state.broken;
    svg.classList.toggle("water", state.water);
    updateBox();

    if (inBand(I)) tasks.complete("one-amp");
    if (inBand(I) && state.n === 6) tasks.complete("six");
    if (P > BREAK && !state.broken) {
      state.broken = true; update();
      K.status(K.t("Lampan gick sönder.", "The bulb broke."), "danger");
    }
  }

  let offset = 0, angle = 0, last = performance.now();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const { I } = physics();
    if (!still) { offset = (offset + I * 160 * dt) % L; angle = (angle + I * 400 * dt) % 360; }
    for (let i = 0; i < N; i++) {
      const p = loop.getPointAtLength((offset + i * L / N) % L);
      dots[i].setAttribute("cx", p.x); dots[i].setAttribute("cy", p.y); dots[i].setAttribute("r", state.water ? 7 : 5);
    }
    $("impeller").style.transform = `rotate(${angle}deg)`;
    $("wheel").style.transform = `rotate(${angle}deg)`;
    requestAnimationFrame(frame);
  }

  const toggleSwitch = () => {
    state.closed = !state.closed;
    // the prediction only counts at the moment the switch closes
    if (state.closed && state.n === 4 && !state.broken && inBand(physics().I)) {
      update(); tasks.complete("predict"); return;
    }
    update();
  };
  $("switch-hit").addEventListener("click", toggleSwitch);
  $("switch-hit").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSwitch(); } });
  $("plus").addEventListener("click", () => { state.n = Math.min(6, state.n + 1); drawCells(); update(); });
  $("minus").addEventListener("click", () => { state.n = Math.max(1, state.n - 1); drawCells(); update(); });
  $("res").addEventListener("input", e => { state.R = +e.target.value; drawResistor(); update(); });
  $("replace").addEventListener("click", () => { state.broken = false; state.closed = false; update(); K.status(""); });
  $("water-btn").addEventListener("click", e => {
    state.water = !state.water; e.currentTarget.setAttribute("aria-pressed", state.water); update();
  });
  K.onLang(update);

  drawCells(); drawResistor(); update();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
