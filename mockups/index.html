<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verkstan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; text-decoration: none; }
  .brand b { font-size: var(--fs-h3); font-weight: 800; letter-spacing: -.01em; }
  .brand svg { width: 28px; height: 28px; flex: none; }

  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 36px; align-items: start; padding-block: 36px 12px; }
  @media (max-width: 920px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
  .hero h1 { font-size: var(--fs-h1); max-width: 16ch; }
  .hero .lead { font-size: var(--fs-h3); color: var(--pencil); margin-top: 14px; max-width: 36ch; line-height: 1.45; }

  .entry { display: grid; gap: 14px; margin-top: 26px; max-width: 440px; }
  .field-group { display: grid; gap: 4px; }
  .field-group label { font-size: var(--fs-small); color: var(--pencil); }
  .field-group .row { display: flex; gap: 8px; }
  .field-group input { flex: 1; min-width: 0; height: 48px; border-radius: 6px; border: 1px solid var(--graphite); background: var(--sheet); padding: 0 12px; font-size: var(--fs-body); }
  .field-group input.code { font-family: var(--font-num); text-transform: uppercase; }
  .dice { width: 48px; height: 48px; flex: none; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); display: grid; place-items: center; cursor: pointer; }
  .dice:hover { border-color: var(--graphite); }

  .map-card { border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); padding: 12px; }
  .map-card .scene { border-color: var(--grid); }
  .m-link { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke var(--fast); }
  .m-link.thin { stroke-dasharray: 2 6; }
  .m-link.lit { stroke: var(--graphite); }
  .m-node { cursor: pointer; }
  .m-node:focus-visible { outline: none; }
  .m-node .bg { fill: var(--sheet); stroke: var(--graphite); stroke-width: 2; }
  .m-node:hover .bg, .m-node:focus-visible .bg { stroke-width: 3.5; }
  .m-node .icon { fill: none; stroke: var(--active); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .m-node .ring { fill: none; stroke: var(--active); stroke-width: 4; transform: rotate(-90deg); transform-box: fill-box; transform-origin: center; }
  .m-node text { font-family: var(--font-text); font-weight: 700; font-size: 14px; fill: var(--graphite); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 40px 0 14px; padding-top: 18px; border-top: 1px solid var(--line); }
  .section-head h2 { font-size: var(--fs-h2); }
  .section-head p { color: var(--pencil); font-size: var(--fs-small); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
  .mod {
    display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px;
    background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
    text-decoration: none; transition: border-color var(--fast) var(--ease);
  }
  .mod:hover, .mod:focus-visible { border-color: var(--graphite); }
  .mod .top { display: flex; align-items: center; gap: 10px; }
  .mod .top svg { width: 36px; height: 36px; flex: none; }
  .mod .top svg * { fill: none; stroke: var(--active); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mod .area { font-size: var(--fs-small); color: var(--pencil); }
  .mod h3 { font-size: var(--fs-h3); }
  .mod p { color: var(--pencil); font-size: 16px; }
  .mod .foot { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--grid); font-size: var(--fs-small); color: var(--pencil); }
  .mod .steps { display: flex; justify-content: space-between; gap: 8px; }
  .mod .steps b { font-family: var(--font-num); font-weight: 600; color: var(--graphite); }
  .mod .meter { height: 4px; border-radius: 2px; background: var(--grid); overflow: hidden; }
  .mod .meter i { display: block; height: 100%; background: var(--active); }


  .lead-workshop { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
  @media (max-width: 640px) { .lead-workshop { grid-template-columns: minmax(0, 1fr); } }
  .lead-workshop p { color: var(--pencil); margin-top: 6px; max-width: 62ch; }
  .lead-workshop .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  footer { padding-block: 30px 40px; color: var(--pencil); font-size: var(--fs-small); }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="Verkstan, startsidan" data-aria-en="Verkstan, start page">
    <svg viewBox="0 0 28 28" aria-hidden="true">
      <rect x="1" y="1" width="26" height="26" rx="6" fill="var(--graphite)"/>
      <path d="M7 9.5 14 20l7-10.5" fill="none" stroke="var(--on-graphite)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <b>Verkstan</b>
  </a>
  <div class="tools">
    <button class="chip" id="lang" type="button" aria-label="Byt språk" data-aria-en="Change language">EN</button>
    <button class="chip" id="theme" type="button" aria-label="Byt mellan ljust och mörkt" data-aria-en="Switch between light and dark">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1 data-en="Workshops about the technology around you">Workshops om tekniken omkring dig</h1>
      <p class="lead" data-en="For teams of 2–4. No prior knowledge needed.">För lag om 2–4. Inga förkunskaper behövs.</p>
      <form class="entry" id="entry">
        <div class="field-group">
          <label for="nick" data-en="Nickname">Smeknamn</label>
          <div class="row">
            <input id="nick" maxlength="24" autocomplete="off">
            <button class="dice" id="dice" type="button" aria-label="Slumpa ett nytt smeknamn" data-aria-en="Pick a new random nickname">
              <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="7.5" r="1.6" fill="currentColor"/><circle cx="14.5" cy="14.5" r="1.6" fill="currentColor"/><circle cx="11" cy="11" r="1.6" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div class="field-group">
          <label for="code" data-en="Room code">Rumskod</label>
          <div class="row">
            <input id="code" class="code" maxlength="7" placeholder="VERK-42" autocomplete="off" spellcheck="false">
            <button class="btn" type="submit" data-en="Join">Gå med</button>
          </div>
        </div>
      </form>
    </div>

    <div class="map-card">
      <div class="scene">
        <svg id="map" viewBox="0 0 540 420" role="img" aria-label="Karta över hur ämnena hänger ihop" data-aria-en="Map of how the subjects connect"></svg>
      </div>
    </div>
  </section>

  <div class="section-head">
    <h2 data-en="Workshops">Workshops</h2>
  </div>
  <div class="grid" id="mods"></div>

  <div class="section-head" style="display:block">
    <section class="lead-workshop">
      <div>
        <h2 style="font-size:var(--fs-h2)" data-en="Leading a workshop">Leda en workshop</h2>
      </div>
      <div class="buttons">
        <a class="btn" href="room.html" data-en="Open the room view">Öppna rumsvyn</a>
        <a class="btn ghost" href="design.html" data-en="Design manual">Designmanual</a>
      </div>
    </section>
  </div>

  <footer data-en="Mock-up. Progress is saved in this browser only.">Mockup. Framstegen sparas bara i den här webbläsaren.</footer>
</main>

<script src="shared/kit.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const ICON = {
    power: '<path d="M9 16.5a5 5 0 1 1 6 0V19H9z"/><path d="M9.5 22h5"/>',
    logic: '<path d="M5 6h6a6 6 0 0 1 0 12H5z"/><path d="M2 9h3M2 15h3M17 12h5"/>',
    signal: '<path d="M2 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0"/>',
    ai: '<circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="10" cy="18" r="2.4"/><path d="M8.2 7 15.8 7.6M17 10.2l-5.4 6M7 8.3l2.2 7.4"/>',
    net: '<circle cx="5" cy="12" r="2.4"/><circle cx="19" cy="5" r="2.4"/><circle cx="19" cy="19" r="2.4"/><path d="M7.2 11 16.8 6M7.2 13l9.6 5M19 7.4v9.2"/>',
    code: '<rect x="4" y="6" width="16" height="13" rx="3"/><path d="M12 6V3M9 12.5h.01M15 12.5h.01"/>',
    math: '<path d="M4 3v17h17"/><path d="M7 16 19 6"/>'
  };
  const AREA = {
    power: { sv: "Ellära", en: "Electricity" }, logic: { sv: "Digital logik", en: "Digital logic" }, signal: { sv: "Signalteknik", en: "Signals" },
    ai: { sv: "AI", en: "AI" }, net: { sv: "Nätverk", en: "Networks" }, code: { sv: "Mjukvara", en: "Software" }, math: { sv: "Matematik", en: "Mathematics" }
  };
  // id, domain, box, title and the problem the team solves
  const M = (id, dom, node, title, problem, tasks = 3) => ({ id, dom, node, title, problem, tasks, file: `modules/${id}.html` });
  const MODS = [
    M("circuit", "power", "node-01", { sv: "Strömkretsen", en: "The circuit" }, { sv: "Exakt en ampere", en: "Exactly one ampere" }, 4),
    M("torch", "power", "node-11", { sv: "Ficklampan", en: "The torch" }, { sv: "En ficklampa för natten", en: "A torch for the night" }),
    M("energy", "power", "plug-01", { sv: "Vad drar mest?", en: "What uses most?" }, { sv: "Vad kostar en kopp te?", en: "What does a cup of tea cost?" }),
    M("gates", "logic", "node-02", { sv: "Logikgrindar", en: "Logic gates" }, { sv: "Tre lampor, tre regler", en: "Three lamps, three rules" }),
    M("binary", "logic", "node-08", { sv: "Åtta lampor", en: "Eight lamps" }, { sv: "Rummet räknar binärt", en: "The room counts in binary" }),
    M("waves", "signal", "node-03", { sv: "Ljudvågor", en: "Sound waves" }, { sv: "Härma ett ljud", en: "Copy a sound" }),
    M("pixels", "signal", "node-09", { sv: "Pixlar", en: "Pixels" }, { sv: "En bild är tal", en: "A picture is numbers" }),
    M("fruit", "ai", "node-04", { sv: "Fruktsorteraren", en: "The fruit sorter" }, { sv: "Lär en maskin att sortera", en: "Teach a machine to sort" }),
    M("nextword", "ai", "node-12", { sv: "Nästa ord", en: "Next word" }, { sv: "Gissa nästa ord", en: "Guess the next word" }),
    M("packets", "net", "node-05", { sv: "Paketresan", en: "Packet tour" }, { sv: "Ett nät som håller", en: "A network that holds" }),
    M("secret", "net", "node-13", { sv: "Hemliga färger", en: "Secret colours" }, { sv: "En hemlighet i det öppna", en: "A secret in the open" }),
    M("robot", "code", "node-06", { sv: "Robotens väg", en: "The robot's path" }, { sv: "Programmera roboten", en: "Programme the robot" }),
    M("sorting", "code", "node-09", { sv: "Sortera", en: "Sorting" }, { sv: "Sortera som en dator", en: "Sort like a computer" }),
    M("function", "math", "node-07", { sv: "Funktionsmaskinen", en: "The function machine" }, { sv: "Vad gör maskinen?", en: "What does the machine do?" }),
    M("dice", "math", "node-10", { sv: "Tärningar", en: "Dice" }, { sv: "Slumpen blir en kurva", en: "Chance becomes a curve" })
  ];
  const NS = "http://www.w3.org/2000/svg";

  function renderMods() {
    const g = $("mods"); g.innerHTML = "";
    MODS.forEach(m => {
      const done = K.progress(m.id).length;
      const a = document.createElement("a");
      a.className = "mod"; a.href = m.file; a.dataset.domain = m.dom;
      if (!document.getElementById(m.dom)) a.id = m.dom;
      a.innerHTML = `<div class="top"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[m.dom]}</svg><span class="area">${K.t(AREA[m.dom])}</span></div>
        <h3>${K.t(m.title)}</h3>
        <p>${K.t(m.problem)}</p>
        <div class="foot">
          <div class="steps"><span class="mono">${m.node}</span><b>${done}/${m.tasks}</b></div>
          <div class="meter" aria-hidden="true"><i style="width:${done / m.tasks * 100}%"></i></div>
        </div>`;
      a.setAttribute("aria-label", `${K.t(m.title)}. ${K.t(m.problem)}. ${K.t(`${done} av ${m.tasks} klara`, `${done} of ${m.tasks} done`)}.`);
      g.append(a);
    });
  }

  const POS = { power: [95, 95], logic: [270, 62], code: [445, 115], ai: [440, 310], net: [265, 362], signal: [95, 305], math: [268, 212] };
  const LINKS = [["power", "logic"], ["logic", "code"], ["code", "ai"], ["power", "signal"], ["signal", "net"], ["net", "ai"],
    ["math", "logic", true], ["math", "ai", true], ["math", "signal", true], ["math", "code", true], ["math", "net", true]];
  function renderMap() {
    const svg = $("map"); svg.innerHTML = "";
    const paths = [];
    LINKS.forEach(([a, b, thin]) => {
      const [x1, y1] = POS[a], [x2, y2] = POS[b];
      const mx = (x1 + x2) / 2 + (y2 - y1) * .12, my = (y1 + y2) / 2 - (x2 - x1) * .12;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);
      p.setAttribute("class", "m-link" + (thin ? " thin" : ""));
      svg.append(p); paths.push({ p, a, b });
    });
    Object.keys(POS).forEach(dom => {
      const mods = MODS.filter(m => m.dom === dom);
      const pr = mods.reduce((a, x) => a + K.progress(x.id).length, 0) / mods.reduce((a, x) => a + x.tasks, 0);
      const [x, y] = POS[dom], r = 30, R = 37, C = 2 * Math.PI * R;
      const g = document.createElementNS(NS, "a");
      g.setAttribute("href", "#" + dom); g.setAttribute("class", "m-node"); g.dataset.domain = dom;
      g.setAttribute("aria-label", K.t(AREA[dom]));
      g.innerHTML = `<circle class="bg" cx="${x}" cy="${y}" r="${r}"/>
        ${pr > 0 ? `<circle class="ring" cx="${x}" cy="${y}" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pr)}"/>` : ""}
        <g class="icon" transform="translate(${x - 15} ${y - 15}) scale(1.25)">${ICON[dom]}</g>
        <text x="${x}" y="${y + r + 22}" text-anchor="middle">${K.t(AREA[dom])}</text>`;
      const light = on => paths.forEach(({ p, a, b }) => p.classList.toggle("lit", on && (a === dom || b === dom)));
      g.addEventListener("pointerenter", () => light(true)); g.addEventListener("pointerleave", () => light(false));
      g.addEventListener("focus", () => light(true)); g.addEventListener("blur", () => light(false));
      svg.append(g);
    });
  }

  $("nick").value = K.nick();
  $("nick").addEventListener("change", e => K.setNick(e.target.value));
  $("dice").addEventListener("click", () => { const n = K.randomNick(); $("nick").value = n; K.setNick(n); });
  $("entry").addEventListener("submit", e => { e.preventDefault(); K.setNick($("nick").value); location.href = "room.html"; });
  const paintLang = () => { $("lang").textContent = K.lang === "sv" ? "EN" : "SV"; };
  $("lang").addEventListener("click", () => { K.setLang(K.lang === "sv" ? "en" : "sv"); paintLang(); });
  $("theme").addEventListener("click", K.toggleTheme);

  function renderAll() { renderMods(); renderMap(); paintLang(); }
  K.onLang(renderAll);
  renderAll();
})();
</script>
</body>
</html>
